[project]
name = "csiapps"
version = "0.3.0"
description = "Helper functions and utilities for CSI data warehouse ingestion and Shiny or Dash web applications (Python port of the csiapps R package)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "David Awosoga", email = "dawosoga@csiontario.ca" },
    { name = "Kyu Min Shim", email = "kmshim@uwaterloo.ca" },
]
keywords = ["csi", "warehouse", "shiny", "dash", "oauth2", "csiontario"]
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.21",
    "faker>=25",
]

[project.optional-dependencies]
# The web frameworks are symmetric, mutually exclusive optional extras: a Shiny
# app installs `[shiny]`, a Dash app installs `[dash]`, and the core (ingestion,
# auth, client, sandbox, shared chrome) depends on neither. See
# https://csiontario.github.io/csiapps/migrating/.
shiny = [
    "shiny>=1.0",
]
dash = [
    "dash>=3.0",
    "dash-auth>=2.3",
]

[project.urls]
Homepage = "https://github.com/CSIOntario/csiapps-py"
Issues = "https://github.com/CSIOntario/csiapps-py/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "respx>=0.21",  # httpx mocking for client tests (phase 3)
]
# Each framework's tests are kept in their own group so CI can install one extra
# and prove the other framework is genuinely absent (e.g. `uv sync --no-group
# dash-tests`). Both framework test suites skip themselves when their extra is
# absent, so the core-only install runs the core suite cleanly.
shiny-tests = ["csiapps[shiny]"]
dash-tests = ["csiapps[dash]"]

[tool.uv]
default-groups = ["dev", "shiny-tests", "dash-tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csiapps"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
