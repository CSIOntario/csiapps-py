name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  # core-only: no framework extras. `import csiapps` must succeed with neither
  # Shiny, Dash, nor Streamlit installed, the core suite must pass, and every
  # framework must be genuinely absent -- this is the pure-ingestion install.
  core-only:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      # No framework extras. Every `uv run` below needs --no-sync: without it uv
      # re-syncs to [tool.uv] default-groups and quietly puts the frameworks
      # back, which would make the isolation a no-op.
      - name: Install core only
        run: uv sync --no-group shiny-tests --no-group dash-tests --no-group streamlit-tests --python ${{ matrix.python-version }}
      - name: Assert no web framework is installed
        run: |
          uv run --no-sync python -c "
          import importlib.util as u
          for mod in ('shiny', 'dash', 'dash_auth', 'flask', 'streamlit', 'cryptography'):
              assert u.find_spec(mod) is None, mod + ' unexpectedly installed'
          print('confirmed: no web framework')
          "
      - name: Assert csiapps imports and the wrappers fail helpfully
        run: |
          uv run --no-sync python -c "
          import csiapps
          assert not hasattr(csiapps, 'ui_wrapper'), 'wrappers must not be top-level'
          for sub in ('csiapps.shiny', 'csiapps.dash', 'csiapps.streamlit'):
              try:
                  __import__(sub)
              except ImportError:
                  pass
              else:
                  raise SystemExit(sub + ' imported without its extra')
          print('ok')
          "
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Test (core suite; framework suites skip themselves)
        run: uv run --no-sync pytest

  # shiny: install [shiny] only. Other frameworks must be absent.
  shiny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install shiny extra only
        run: uv sync --no-group dash-tests --no-group streamlit-tests
      - name: Assert other frameworks are genuinely absent
        run: |
          uv run --no-sync python -c "
          import importlib.util as u
          for mod in ('dash', 'dash_auth', 'streamlit'):
              assert u.find_spec(mod) is None, mod + ' unexpectedly installed'
          import csiapps.shiny  # must import cleanly
          print('confirmed: shiny only')
          "
      - name: Test
        run: uv run --no-sync pytest

  # dash: install [dash] only. Other frameworks must be absent.
  dash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dash extra only
        run: uv sync --no-group shiny-tests --no-group streamlit-tests
      - name: Assert other frameworks are genuinely absent
        run: |
          uv run --no-sync python -c "
          import importlib.util as u
          for mod in ('shiny', 'streamlit', 'starlette'):
              assert u.find_spec(mod) is None, mod + ' unexpectedly installed'
          import csiapps.dash  # must import cleanly
          print('confirmed: dash only')
          "
      - name: Test
        run: uv run --no-sync pytest

  # streamlit: install [streamlit] only. Other frameworks must be absent.
  streamlit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install Streamlit extra only
        run: uv sync --no-group shiny-tests --no-group dash-tests
      - name: Assert other frameworks are genuinely absent
        run: |
          uv run --no-sync python -c "
          import importlib.util as u
          for mod in ('shiny', 'dash', 'dash_auth', 'flask'):
              assert u.find_spec(mod) is None, mod + ' unexpectedly installed'
          import csiapps.streamlit  # must import cleanly
          print('confirmed: streamlit only')
          "
      - name: Test
        run: uv run --no-sync pytest

  # Guard: no framework import may appear anywhere in src/csiapps/ except its
  # matching framework module. This is what keeps the core
  # framework-independent; grep for the imports rather than trusting review.
  import-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert only framework modules import web frameworks
        run: |
          # Match real top-level imports of framework packages (`import dash`,
          # `from flask import ...`), not our own `from csiapps.shiny import ...`
          # submodule references or docstring prose.
          offenders=$(grep -rnE '^[[:space:]]*(import|from)[[:space:]]+(shiny|flask|dash|dash_auth|werkzeug|streamlit|starlette)\b' \
            src/csiapps/ --include='*.py' \
            | grep -vE '/(shiny|dash|streamlit)\.py:' || true)
          if [ -n "$offenders" ]; then
            echo "Web-framework import outside its framework module:"
            echo "$offenders"
            exit 1
          fi
          echo "confirmed: core imports no web framework"

  # build: the artifact `uv publish` would upload must be buildable, valid on
  # PyPI's terms, and installable -- checked here rather than discovered at
  # publish time, which is the last step of the release and the worst moment to
  # find a packaging error. See https://csiontario.github.io/csiapps/releasing/
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Build sdist and wheel
        run: uv build
      # PyPI rejects an upload outright if the metadata or long description is
      # malformed; --strict also fails on warnings, so a README that renders
      # badly on the project page is caught here too.
      - name: Validate distribution metadata
        run: uvx twine check --strict dist/*
      # Building is not installing: hatchling packaging framework modules
      # is fine, but a missing package/data file, or an extra leaking into the
      # base dependencies, only shows up on a real install into a clean env.
      - name: Install the wheel into a clean env and verify the core contract
        run: |
          uv venv /tmp/wheeltest
          VIRTUAL_ENV=/tmp/wheeltest uv pip install dist/*.whl
          /tmp/wheeltest/bin/python -c "
          import csiapps, importlib.util as u
          import tomllib, pathlib
          # The release checklist bumps pyproject.toml *and* __version__; they
          # drift silently, and the wrong one ends up on the PyPI page.
          declared = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert csiapps.__version__ == declared, (
              'version drift: pyproject.toml %s != __version__ %s' % (declared, csiapps.__version__))
          assert not hasattr(csiapps, 'ui_wrapper'), 'wrappers must not be top-level'
          for mod in ('shiny', 'dash', 'dash_auth', 'flask', 'streamlit', 'cryptography'):
              assert u.find_spec(mod) is None, mod + ' leaked into a bare wheel install'
          print('ok: csiapps', csiapps.__version__, '- core-only wheel installs clean')
          "
      - name: Upload dist/ for inspection
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
