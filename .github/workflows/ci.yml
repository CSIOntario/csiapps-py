name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # core-only: no framework extras. `import csiapps` must succeed with neither
  # Shiny nor Dash installed, the core suite must pass, and both frameworks must
  # be genuinely absent -- this is the pure-ingestion install.
  core-only:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      # No framework extras. Every `uv run` below needs --no-sync: without it uv
      # re-syncs to [tool.uv] default-groups and quietly puts the frameworks
      # back, which would make the isolation a no-op.
      - name: Install core only
        run: uv sync --no-group shiny-tests --no-group dash-tests --python ${{ matrix.python-version }}
      - name: Assert no web framework is installed
        run: |
          uv run --no-sync python -c "
          import importlib.util as u
          for mod in ('shiny', 'dash', 'dash_auth', 'flask'):
              assert u.find_spec(mod) is None, mod + ' unexpectedly installed'
          print('confirmed: no shiny, no dash, no flask')
          "
      - name: Assert csiapps imports and the wrappers fail helpfully
        run: |
          uv run --no-sync python -c "
          import csiapps
          assert not hasattr(csiapps, 'ui_wrapper'), 'wrappers must not be top-level'
          for sub in ('csiapps.shiny', 'csiapps.dash'):
              try:
                  __import__(sub)
              except ImportError:
                  pass
              else:
                  raise SystemExit(sub + ' imported without its extra')
          print('ok')
          "
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Test (core suite; framework suites skip themselves)
        run: uv run --no-sync pytest

  # shiny: install [shiny] only. The Shiny suite runs; Dash must be absent.
  shiny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install shiny extra only
        run: uv sync --no-group dash-tests
      - name: Assert Dash is genuinely absent
        run: |
          uv run --no-sync python -c "
          import importlib.util as u
          for mod in ('dash', 'dash_auth'):
              assert u.find_spec(mod) is None, mod + ' unexpectedly installed'
          import csiapps.shiny  # must import cleanly
          print('confirmed: shiny present, dash absent')
          "
      - name: Test
        run: uv run --no-sync pytest

  # dash: install [dash] only. The Dash suite runs; Shiny must be absent.
  dash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dash extra only
        run: uv sync --no-group shiny-tests
      - name: Assert Shiny is genuinely absent
        run: |
          uv run --no-sync python -c "
          import importlib.util as u
          assert u.find_spec('shiny') is None, 'shiny unexpectedly installed'
          import csiapps.dash  # must import cleanly
          print('confirmed: dash present, shiny absent')
          "
      - name: Test
        run: uv run --no-sync pytest

  # Guard: no shiny/flask/dash/dash_auth/werkzeug import may appear anywhere in
  # src/csiapps/ except the two framework modules. This is what keeps the core
  # framework-independent; grep for the imports rather than trusting review.
  import-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert only shiny.py / dash.py import a web framework
        run: |
          # Match real top-level imports of the framework packages (`import dash`,
          # `from flask import ...`), not our own `from csiapps.shiny import ...`
          # submodule references or docstring prose.
          offenders=$(grep -rnE '^[[:space:]]*(import|from)[[:space:]]+(shiny|flask|dash|dash_auth|werkzeug)\b' \
            src/csiapps/ --include='*.py' \
            | grep -vE '/(shiny|dash)\.py:' || true)
          if [ -n "$offenders" ]; then
            echo "Web-framework import outside shiny.py/dash.py:"
            echo "$offenders"
            exit 1
          fi
          echo "confirmed: core imports no web framework"
